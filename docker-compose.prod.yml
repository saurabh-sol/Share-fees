# Production stack. Copy .env.production.example → .env.production first.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
#
# Postgres and Redis stay on the Docker network. Only the app is published.
# Privy: set APP_ORIGIN to your public https URL and allow it in the Privy dashboard.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-t2c}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trade2credits}
    volumes:
      - t2c_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t2c} -d ${POSTGRES_DB:-trade2credits}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - t2c_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.production
        required: true
    environment:
      NODE_ENV: production
      ALLOW_MOCK_SWAPS: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://t2c:${POSTGRES_PASSWORD}@postgres:5432/trade2credits}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  cron:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env.production
        required: true
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          curl -fsS -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/v1/jobs/payouts || true
          curl -fsS -H "Authorization: Bearer $${CRON_SECRET}" http://app:3000/api/v1/jobs/settles || true
          sleep 60
        done

volumes:
  t2c_pg_prod:
  t2c_redis_prod:
